name: 刷新黄果+51吃瓜数据

# 每小时 37 分跑生成器，把新鲜数据 JSON 推回本仓库。
# 推送用仓库自带的 GITHUB_TOKEN，不经过 Muse，不需要人工点审批。
# 生成器在 hg/scripts/，输出 hg/cg/huangguo_51chigua_gh.json（加密包裹，供映匣 T3 用）。
on:
  schedule:
    - cron: '37 * * * *'
  workflow_dispatch:

permissions:
  contents: write

# 同一时间只跑一个刷新（手动触发和整点触发不重叠），后到的排队等前一个跑完。
concurrency:
  group: refresh-huangguo
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: pip install --quiet requests pycryptodome pyquery

      - name: 生成数据 JSON
        env:
          GH_DATA_JSON: hg/cg/huangguo_51chigua_gh.json
          GH_REPORT_JSON: /tmp/last_run_report.json
        run: python hg/scripts/gen_huangguo_51chigua_gh.py

      - name: 提交并推送
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add hg/cg/huangguo_51chigua_gh.json
          if git diff --cached --quiet; then
            echo "数据无变化，跳过提交"
            exit 0
          fi
          git commit -m "黄果+51吃瓜 GitHub 版数据（每小时刷新）"
          git pull --rebase origin main
          git push origin main
